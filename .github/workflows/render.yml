name: render

on:
  push:
    branches: [main]
    paths: [build_station.py, encode.sh, .github/**]
  workflow_dispatch:
    inputs:
      mode:
        description: what to render
        type: choice
        options: [preview, still, anim, all]
        default: all
      res:
        description: resolution percentage of 1920x1080
        default: "100"
      samples_still:
        description: Cycles samples for the 1080p still
        default: "320"
      samples_anim:
        description: Cycles samples per animation frame
        default: "64"
      chunks:
        description: how many parallel jobs the frame range is split across
        default: "24"
      frames:
        description: frame range to render, e.g. 193-264 to redo only shot C
        default: "1-264"
      reuse_run:
        description: run id whose frames fill everything outside the range (blank = render all)
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  preview:
    if: github.event_name == 'push' || inputs.mode == 'preview' || inputs.mode == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/blender
      - name: render half-res preview
        run: ~/blender/blender -b -P build_station.py -- preview ci 2>&1 | grep -E "RENDERED|Error|Traceback|^Time"
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: renders/preview_ci.png

  still:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'still' || inputs.mode == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/blender
      - name: render the 1080p still
        env:
          STATION_RES: ${{ inputs.res }}
          STATION_SAMPLES: ${{ inputs.samples_still }}
        run: ~/blender/blender -b -P build_station.py -- final ci 2>&1 | grep -E "RENDERED|Error|Traceback|^Time|Sample [0-9]+/[0-9]+$" | awk 'NR % 20 == 0 || !/Sample/'
      - uses: actions/upload-artifact@v4
        with:
          name: still
          path: renders/final_ci.png

  plan:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'anim' || inputs.mode == 'all')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - "${{ inputs.chunks }}" "${{ inputs.frames }}" <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          n = int(sys.argv[1]); a, b = map(int, sys.argv[2].split('-'))
          per = -(-(b - a + 1) // n)
          items = [{"start": s, "end": min(b, s + per - 1)} for s in range(a, b + 1, per)]
          print("matrix=" + json.dumps({"include": items}))
          EOF

  anim:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/blender
      - name: render frames ${{ matrix.start }}-${{ matrix.end }}
        env:
          STATION_RES: ${{ inputs.res }}
          STATION_SAMPLES: ${{ inputs.samples_anim }}
          STATION_FRAMES: ${{ matrix.start }}-${{ matrix.end }}
        run: ~/blender/blender -b -P build_station.py -- anim png ci 2>&1 | grep -E "RENDERED|Error|Traceback|FRAME RANGE|^Saved|^Time"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.start }}
          path: renders/fly_ci/f_*.png

  encode:
    needs: anim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: frames from an earlier run (only the ones outside this run's range get used)
        if: inputs.reuse_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.reuse_run }}" --repo "$GITHUB_REPOSITORY" --pattern 'frames-*' --dir old
          mkdir -p frames && find old -name 'f_*.png' -exec mv -f {} frames/ \;
          echo "reused: $(ls frames | wc -l)"
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
          path: new
      - name: assemble the film (title card, three shots, crossfades)
        run: |
          mkdir -p frames && cp -f new/f_*.png frames/
          echo "new: $(ls new | wc -l)  total: $(ls frames | wc -l)"
          [ "$(ls frames/f_*.png | wc -l)" -eq 264 ] || { echo "expected 264 frames"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          bash encode.sh frames station_film.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: film
          path: station_film.mp4

  publish:
    needs: [still, encode]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (needs.still.result == 'success' || needs.encode.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: still
          path: out
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: film
          path: out
        continue-on-error: true
      - name: attach outputs to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          tag="run-${{ github.run_number }}"
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --title "Render $tag" \
            --notes "mode=${{ inputs.mode }} res=${{ inputs.res }}% still=${{ inputs.samples_still }}spp anim=${{ inputs.samples_anim }}spp chunks=${{ inputs.chunks }} frames=${{ inputs.frames }} reuse_run=${{ inputs.reuse_run }}"
